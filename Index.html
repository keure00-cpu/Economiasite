<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Curso de Economia | Do Zero ao Avançado</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#2563eb;
    --blue-dark:#0f172a;
    --blue-light:#eff6ff;
    --green:#16a34a;
    --text:#172033;
    --muted:#667085;
    --white:#ffffff;
    --border:#e5e7eb;
    --bg:#f5f7fb;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

/* HEADER */

header{
    background:
    radial-gradient(circle at top right,#2563eb 0,transparent 35%),
    linear-gradient(135deg,#020617,#172554);

    color:white;
    padding:70px 20px 80px;
}

.container{
    width:100%;
    max-width:1150px;
    margin:auto;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:70px;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:bold;
}

.hero{
    display:grid;
    grid-template-columns:1.5fr .8fr;
    gap:50px;
    align-items:center;
}

.badge{
    display:inline-block;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    padding:8px 14px;
    border-radius:30px;
    font-size:14px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(38px,6vw,65px);
    line-height:1.05;
    margin-bottom:20px;
}

.hero h1 span{
    color:#60a5fa;
}

.hero-description{
    color:#cbd5e1;
    font-size:19px;
    max-width:700px;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:15px 22px;
    border-radius:12px;
    text-decoration:none;
    font-weight:800;
    transition:.2s;
    cursor:pointer;
    border:none;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-buy{
    background:#22c55e;
    color:white;
    box-shadow:0 10px 25px rgba(34,197,94,.2);
}

.btn-buy:hover{
    background:#16a34a;
}

.btn-contact{
    background:white;
    color:#1d4ed8;
}

.price-card{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:30px;
    box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.price-card h3{
    font-size:18px;
    margin-bottom:15px;
}

.price{
    font-size:50px;
    font-weight:900;
    margin-bottom:5px;
}

.price-description{
    color:#cbd5e1;
    margin-bottom:20px;
}

.price-card ul{
    list-style:none;
    margin:20px 0;
}

.price-card li{
    margin:12px 0;
}

/* SECTIONS */

section{
    padding:70px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:38px;
    margin-bottom:10px;
}

.section-title p{
    color:var(--muted);
}

/* FEATURES */

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.feature{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
}

.feature-icon{
    font-size:35px;
    margin-bottom:15px;
}

.feature h3{
    margin-bottom:8px;
}

.feature p{
    color:var(--muted);
}

/* COURSE */

.course-layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:25px;
}

.sidebar{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:15px;
    height:max-content;
    position:sticky;
    top:20px;
}

.sidebar h3{
    padding:10px;
    margin-bottom:8px;
}

.module-btn{
    width:100%;
    border:0;
    background:none;
    text-align:left;
    padding:13px;
    border-radius:10px;
    cursor:pointer;
    color:var(--text);
    font-weight:bold;
    margin:2px 0;
}

.module-btn:hover,
.module-btn.active{
    background:var(--blue-light);
    color:var(--blue);
}

/* LESSON */

.lesson{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px;
}

.lesson-meta{
    color:var(--muted);
    font-size:14px;
    margin-bottom:8px;
}

.lesson h2{
    font-size:34px;
    margin-bottom:20px;
}

.video{
    width:100%;
    aspect-ratio:16/9;
    background:
    linear-gradient(135deg,#020617,#1e293b);
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    margin:25px 0;
    overflow:hidden;
}

/* Quando você colocar o vídeo real */
.video video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.video-placeholder{
    text-align:center;
}

.play{
    width:75px;
    height:75px;
    background:var(--blue);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    margin:auto auto 12px;
}

.lesson-text{
    font-size:17px;
    line-height:1.8;
}

.example{
    background:#eff6ff;
    border-left:4px solid var(--blue);
    padding:18px;
    border-radius:8px;
    margin-top:20px;
}

.actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:25px;
}

.btn-primary{
    background:var(--blue);
    color:white;
}

.btn-secondary{
    background:#eef2f7;
    color:var(--text);
}

/* QUIZ */

.quiz{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px;
    margin-top:20px;
}

.quiz h3{
    font-size:23px;
    margin-bottom:20px;
}

.option{
    display:block;
    padding:14px;
    border:1px solid var(--border);
    border-radius:10px;
    margin:10px 0;
    cursor:pointer;
}

.option:hover{
    background:#f8fafc;
}

.quiz-result{
    margin-top:15px;
    font-weight:bold;
}

/* PROGRESS */

.progress-card{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:25px;
    margin-top:20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-weight:bold;
}

.progress-bar{
    height:12px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:var(--blue);
    transition:.4s;
}

/* CERTIFICATE */

.certificate{
    display:none;
    text-align:center;
    background:linear-gradient(135deg,#eff6ff,#ffffff);
    border:2px solid #bfdbfe;
    border-radius:20px;
    padding:45px;
    margin-top:20px;
}

.certificate h2{
    font-size:35px;
    margin-bottom:15px;
}

/* CTA */

.cta{
    background:linear-gradient(135deg,#1d4ed8,#0f172a);
    color:white;
    text-align:center;
}

.cta h2{
    font-size:40px;
    margin-bottom:15px;
}

.cta p{
    color:#cbd5e1;
    margin-bottom:25px;
}

/* FOOTER */

footer{
    background:#020617;
    color:#94a3b8;
    text-align:center;
    padding:35px 20px;
}

/* MOBILE */

@media(max-width:850px){

    .hero{
        grid-template-columns:1fr;
    }

    .features{
        grid-template-columns:1fr;
    }

    .course-layout{
        grid-template
